<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Demo Store</title>
<style>
  :root { --accent: #364fc7; --err: #c92a2a; --muted: #667085; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #eef1f6; display: grid; place-items: center; min-height: 100vh; }
  main { background: #fff; border-radius: 14px; padding: 28px; width: min(440px, 94vw); box-shadow: 0 6px 24px rgb(0 0 0 / .07); }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  .item { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #edf0f4; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #cbd2dc; background: #fff; cursor: pointer; font-size: 1rem; }
  .qty button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .line-total { font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
  .remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .8rem; text-decoration: underline; }
  .promo { display: flex; gap: 8px; margin: 18px 0 6px; }
  .promo input { flex: 1; padding: 10px 12px; border: 1.5px solid #cbd2dc; border-radius: 8px; font: inherit; }
  .promo button { padding: 10px 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  #promo-msg { min-height: 1.1em; font-size: .85rem; margin: 0 0 8px; }
  #promo-msg.err { color: var(--err); }
  #promo-msg.ok { color: #087f5b; }
  .totals { margin-top: 14px; display: grid; gap: 6px; }
  .totals .row { display: flex; justify-content: space-between; }
  .totals .grand { font-weight: 700; font-size: 1.1rem; }
  #empty { color: var(--muted); text-align: center; padding: 24px 0; display: none; }
</style>
</head>
<body>
<main>
  <h1>Your order</h1>
  <section id="cart" aria-label="Cart items"></section>
  <p id="empty">Your cart is empty.</p>

  <div class="promo">
    <label for="promo-input" class="visually-hidden" style="position:absolute;left:-9999px">Promo code</label>
    <input id="promo-input" placeholder="Promo code" />
    <button id="promo-apply" type="button">Apply</button>
  </div>
  <p id="promo-msg" aria-live="polite"></p>

  <div class="totals">
    <div class="row"><span>Subtotal</span><span id="subtotal">—</span></div>
    <div class="row"><span>Discount</span><span id="discount">—</span></div>
    <div class="row grand"><span>Total</span><span id="total">—</span></div>
  </div>
</main>
<script>
// All money in integer cents — never float.
const state = {
  items: [
    { id: "tee",  name: "Studio Tee",     cents: 4500, qty: 1 },
    { id: "mug",  name: "Designer Mug",   cents: 2200, qty: 2 },
    { id: "tote", name: "Canvas Tote",    cents: 3800, qty: 1 },
  ],
  discountPct: 0,
};

const CODES = { "SAVE10": 10 };

const fmt = (c) => "$" + (c / 100).toFixed(2);

function totals() {
  const sub = state.items.reduce((s, it) => s + it.cents * it.qty, 0);
  const disc = Math.round(sub * state.discountPct / 100);
  return { sub, disc, grand: sub - disc };
}

function render() {
  const cart = document.getElementById("cart");
  cart.innerHTML = "";
  for (const it of state.items) {
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <div>
        <div>${it.name}</div>
        <button class="remove" data-id="${it.id}">Remove</button>
      </div>
      <div class="qty">
        <button data-id="${it.id}" data-d="-1" aria-label="Decrease ${it.name} quantity">−</button>
        <span aria-label="${it.name} quantity">${it.qty}</span>
        <button data-id="${it.id}" data-d="1" aria-label="Increase ${it.name} quantity">+</button>
      </div>
      <div class="line-total">${fmt(it.cents * it.qty)}</div>`;
    cart.appendChild(row);
  }
  document.getElementById("empty").style.display = state.items.length ? "none" : "block";
  const t = totals();
  document.getElementById("subtotal").textContent = fmt(t.sub);
  document.getElementById("discount").textContent = t.disc ? "−" + fmt(t.disc) : "—";
  document.getElementById("total").textContent = fmt(t.grand);
}

document.getElementById("cart").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const item = state.items.find((i) => i.id === btn.dataset.id);
  if (!item) return;
  if (btn.classList.contains("remove")) {
    state.items = state.items.filter((i) => i !== item);
  } else {
    item.qty = Math.max(1, item.qty + Number(btn.dataset.d));
  }
  render();
});

document.getElementById("promo-apply").addEventListener("click", () => {
  const code = document.getElementById("promo-input").value.trim();
  const msg = document.getElementById("promo-msg");
  if (CODES[code]) {
    state.discountPct = CODES[code];
    msg.textContent = `Code applied: ${state.discountPct}% off`;
    msg.className = "ok";
  } else {
    state.discountPct = 0;
    msg.textContent = "That code isn't valid.";
    msg.className = "err";
  }
  render();
});

render();
</script>
</body>
</html>
